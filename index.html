<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Online</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>📚 Biblioteca Online</h1>

    <p>Bem-vindo! Escolha uma opção abaixo.</p>

    <div class="botoes">

        <button>Visualizar Autores</button>

        <button>Visualizar Livros</button>

    </div>

    <section class="card">

        <h2>Autores Cadastrados</h2>

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Nascimento</th>
                    <th>Idade</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Epiteto</td>
                    <td>25 A.C</td>
                    <td>120</td>
                </tr>

                <tr>
                    <td>Marco Aurélio</td>
                    <td>121 D.C</td>
                    <td>58</td>
                </tr>

                <tr>
                    <td>Sêneca</td>
                    <td>4 A.C</td>
                    <td>69</td>
                </tr>

            </tbody>

        </table>

    </section>

    <section class="card">

        <h2>Livros Disponíveis</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Livro</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>1</td>
                    <td>O Pequeno Príncipe</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Bíblia Estoica</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Diário de um Banana</td>
                </tr>

            </tbody>

        </table>

    </section>

    <section class="card">

        <h2>Alugar Livro</h2>

        <label>Digite o ID do livro</label>

        <input type="number" placeholder="Ex.: 2">

        <button class="alugar">
            Alugar Livro
        </button>

    </section>

</div>

</body>
</html>
